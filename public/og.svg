<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Passdesk — Let your agents work. Keep the keys.</title>
  <defs>
    <!-- Matches the stage token in src/styles/tokens.css: a quiet vertical gradient, no bloom. -->
    <linearGradient id="og-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3328" />
      <stop offset="60%" stop-color="#092a21" />
      <stop offset="100%" stop-color="#07231b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-stage)" />

  <!-- Key mark: src/components/KeyMark.tsx, scaled; brass as a line, never a glow. -->
  <g transform="translate(90,84) scale(1.8)">
    <circle cx="10" cy="16" r="5.5" fill="none" stroke="#e1b65a" stroke-width="2.25" />
    <path
      d="M15.5 16H28M23.5 16v5M27 16v4"
      fill="none"
      stroke="#e1b65a"
      stroke-width="2.25"
      stroke-linecap="round"
    />
  </g>
  <text
    x="160"
    y="123"
    font-family="'Schibsted Grotesk Variable', 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.7"
    fill="#f6f7f3"
  >Passdesk</text>

  <!-- Eyebrow: same copy and styling intent as the brass eyebrow on dark (src/styles/global.css). -->
  <text
    x="90"
    y="236"
    font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
    font-size="18"
    font-weight="500"
    letter-spacing="2.2"
    fill="#eac46c"
  >OPEN SOURCE &#183; RUNS ON YOUR MACHINE</text>

  <!-- Headline: copied exactly from src/components/Hero.tsx. -->
  <text
    x="88"
    y="372"
    font-family="'Schibsted Grotesk Variable', 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="-2"
    fill="#f6f7f3"
  >Let your agents work.</text>
  <text
    x="88"
    y="444"
    font-family="'Schibsted Grotesk Variable', 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="-2"
    fill="#eac46c"
  >Keep the keys.</text>
</svg>
